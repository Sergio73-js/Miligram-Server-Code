<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miligram Messenger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b1426;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background: #131f3b;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        /* СТРАНИЦА ВХОДА */
        .auth-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 30px;
            height: 100%;
        }

        .auth-screen h2 {
            font-size: 28px;
            margin-bottom: 30px;
            text-align: center;
            color: #4e9aff;
        }

        .auth-screen input {
            padding: 14px;
            margin-bottom: 15px;
            border: none;
            border-radius: 30px;
            background: #1e3050;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        .auth-screen button {
            padding: 14px;
            border: none;
            border-radius: 30px;
            background: #4e9aff;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .auth-screen button:hover {
            background: #3b7ed9;
        }

        .auth-screen .switch {
            text-align: center;
            margin-top: 15px;
            color: #8aa3d6;
            cursor: pointer;
            font-size: 14px;
        }

        /* ЧАТ */
        .chat-header {
            padding: 15px 20px;
            background: #1a2a4a;
            border-bottom: 1px solid #2a3f5f;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header .username {
            font-weight: bold;
            font-size: 18px;
            color: #4e9aff;
        }

        .chat-header .logout {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 14px;
        }

        .chat-users {
            padding: 10px 20px;
            background: #182a48;
            border-bottom: 1px solid #2a3f5f;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            overflow-x: auto;
        }

        .chat-users .user {
            font-size: 14px;
            padding: 5px 12px;
            border-radius: 20px;
            background: #2a4060;
            cursor: pointer;
            transition: 0.2s;
        }

        .chat-users .user.online {
            background: #1a6e3a;
            color: #8cffa6;
        }

        .chat-users .user.offline {
            opacity: 0.5;
        }

        .chat-messages {
            flex: 1;
            padding: 15px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #0f1c34;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 15px;
            word-wrap: break-word;
            background: #1e3050;
        }

        .message.self {
            align-self: flex-end;
            background: #4e9aff;
            color: #fff;
        }

        .message .time {
            font-size: 10px;
            color: #8aa3d6;
            margin-top: 5px;
            text-align: right;
        }

        .chat-input {
            display: flex;
            padding: 12px 20px;
            background: #1a2a4a;
            border-top: 1px solid #2a3f5f;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 30px;
            background: #1e3050;
            color: #fff;
            outline: none;
            font-size: 15px;
        }

        .chat-input button {
            padding: 12px 20px;
            border: none;
            border-radius: 30px;
            background: #4e9aff;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .chat-input button:hover {
            background: #3b7ed9;
        }

        .chat-input .file-btn {
            background: #2a4060;
            padding: 12px 14px;
            border-radius: 30px;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e3050;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            color: #fff;
            z-index: 9999;
            animation: fadeUp 2s ease;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(30px);
            }
            15% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            85% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-30px);
            }
        }
    </style>
</head>
<body>

    <div id="app">

        <!-- АВТОРИЗАЦИЯ -->
        <div id="authScreen" class="auth-screen">
            <h2>💙 Miligram</h2>
            <input type="text" id="loginUsername" placeholder="Имя пользователя">
            <input type="password" id="loginPassword" placeholder="Пароль">
            <button onclick="login()">Войти</button>
            <div class="switch" onclick="showRegister()">📝 Создать аккаунт</div>
            <div id="error" style="color:#ff6b6b; margin-top:10px; text-align:center;"></div>
        </div>

        <div id="registerScreen" class="auth-screen hidden">
            <h2>📝 Регистрация</h2>
            <input type="text" id="regUsername" placeholder="Имя пользователя">
            <input type="password" id="regPassword" placeholder="Пароль">
            <button onclick="register()">Создать</button>
            <div class="switch" onclick="showLogin()">← Назад</div>
            <div id="regError" style="color:#ff6b6b; margin-top:10px; text-align:center;"></div>
        </div>

        <!-- ЧАТ -->
        <div id="chatScreen" class="hidden" style="display:flex; flex-direction:column; height:100%;">
            <div class="chat-header">
                <span class="username" id="currentUser">@user</span>
                <button class="logout" onclick="logout()">🚪 Выйти</button>
            </div>

            <div class="chat-users" id="usersList"></div>

            <div class="chat-messages" id="messages"></div>

            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="Сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">📤</button>
                <label class="file-btn">📎<input type="file" id="fileInput" style="display:none;" onchange="uploadFile(this.files[0])"></label>
            </div>
        </div>

    </div>

    <script>
        const SERVER_URL = window.location.origin;
        const WS_URL = `ws://${window.location.hostname}:8081`;

        let currentUser = '';
        let currentChat = '';
        let ws = null;

        // ============= ВСПОМОГАТЕЛЬНЫЕ =============
        function toast(msg) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2000);
        }

        function showRegister() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('registerScreen').classList.remove('hidden');
        }

        function showLogin() {
            document.getElementById('authScreen').classList.remove('hidden');
            document.getElementById('registerScreen').classList.add('hidden');
        }

        // ============= РЕГИСТРАЦИЯ =============
        async function register() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const err = document.getElementById('regError');

            if (!username || !password) return err.textContent = 'Заполните поля';

            try {
                const res = await fetch(`${SERVER_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    toast('✅ Аккаунт создан!');
                    showLogin();
                } else {
                    err.textContent = data.error || 'Ошибка';
                }
            } catch (e) {
                err.textContent = 'Ошибка сервера';
            }
        }

        // ============= ЛОГИН =============
        async function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const err = document.getElementById('error');

            if (!username || !password) return err.textContent = 'Заполните поля';

            try {
                const res = await fetch(`${SERVER_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    currentUser = data.username;
                    document.getElementById('currentUser').textContent = '@' + currentUser;
                    document.getElementById('authScreen').classList.add('hidden');
                    document.getElementById('chatScreen').classList.remove('hidden');

                    connectWebSocket();
                    loadUsers();
                    loadMessages();
                } else {
                    err.textContent = data.error || 'Неверные данные';
                }
            } catch (e) {
                err.textContent = 'Ошибка сервера';
            }
        }

        // ============= ВЕБСОКЕТ =============
        function connectWebSocket() {
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'login', username: currentUser }));
            };

            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.type === 'message') {
                    appendMessage(msg.from, msg.text, msg.time);
                }
            };

            ws.onclose = () => {
                setTimeout(connectWebSocket, 3000);
            };
        }

        // ============= ПОЛЬЗОВАТЕЛИ =============
        async function loadUsers() {
            try {
                const res = await fetch(`${SERVER_URL}/users`);
                const users = await res.json();
                const container = document.getElementById('usersList');
                container.innerHTML = users.map(u =>
                    `<div class="user ${u.status === 'online' ? 'online' : 'offline'}" onclick="openChat('${u.username}')">
                        ${u.username} ${u.status === 'online' ? '🟢' : '⚫'}
                    </div>`
                ).join('');
            } catch (e) {
                console.error(e);
            }
        }

        function openChat(username) {
            currentChat = username;
            loadMessages();
        }

        // ============= СООБЩЕНИЯ =============
        async function loadMessages() {
            if (!currentChat) return;
            try {
                const res = await fetch(`${SERVER_URL}/messages/${currentChat}`);
                const msgs = await res.json();
                const container = document.getElementById('messages');
                container.innerHTML = msgs.map(m =>
                    `<div class="message ${m.from_user === currentUser ? 'self' : ''}">
                        <strong>${m.from_user}</strong> ${m.text}
                        ${m.media_url ? `<br><a href="${SERVER_URL}${m.media_url}" target="_blank">📎 Файл</a>` : ''}
                        <div class="time">${new Date(m.created_at).toLocaleTimeString()}</div>
                    </div>`
                ).join('');
                container.scrollTop = container.scrollHeight;
            } catch (e) {
                console.error(e);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !currentChat) return;

            try {
                await fetch(`${SERVER_URL}/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: 1,
                        from_user: currentUser,
                        to_user: currentChat,
                        text
                    })
                });
                input.value = '';
                loadMessages();
                // Отправляем через WebSocket
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'message',
                        to_user: currentChat,
                        text
                    }));
                }
            } catch (e) {
                toast('❌ Ошибка отправки');
            }
        }

        // ============= ЗАГРУЗКА ФАЙЛОВ =============
        async function uploadFile(file) {
            if (!file) return;
            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch(`${SERVER_URL}/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (data.success) {
                    await fetch(`${SERVER_URL}/send`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: 1,
                            from_user: currentUser,
                            to_user: currentChat || 'all',
                            text: '📎 Файл',
                            media_url: data.url
                        })
                    });
                    loadMessages();
                }
            } catch (e) {
                toast('❌ Ошибка загрузки');
            }
        }

        // ============= ВЫХОД =============
        async function logout() {
            try {
                await fetch(`${SERVER_URL}/logout`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUser })
                });
            } catch (e) {}
            if (ws) ws.close();
            currentUser = '';
            currentChat = '';
            document.getElementById('chatScreen').classList.add('hidden');
            document.getElementById('authScreen').classList.remove('hidden');
        }

        // ============= ПЕРИОДИЧЕСКОЕ ОБНОВЛЕНИЕ =============
        setInterval(() => {
            if (currentUser) {
                loadUsers();
                if (currentChat) loadMessages();
            }
        }, 5000);

        // Автовход по токену (если есть)
        // Можно добавить localStorage позже
    </script>
</body>
</html>
