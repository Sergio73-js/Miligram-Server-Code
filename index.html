<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miligram Messenger</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .hidden { display: none !important; }
        .auth-box {
            background: white;
            padding: 32px 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        .auth-box h2 { text-align: center; color: #4A90D9; margin-bottom: 24px; }
        .auth-box input {
            width: 100%;
            padding: 12px 16px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 30px;
            font-size: 16px;
        }
        .auth-box button {
            width: 100%;
            padding: 12px;
            background: #4A90D9;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 12px;
        }
        .auth-link {
            text-align: center;
            margin-top: 16px;
            color: #4A90D9;
            cursor: pointer;
        }
        .error { color: #ef4444; font-size: 14px; margin-top: 8px; text-align: center; }
        .app { width: 100%; max-width: 800px; height: 90vh; background: white; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .header {
            padding: 16px 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
        }
        .header h3 { color: #4A90D9; }
        .logout-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 14px; }
        .main { display: flex; flex: 1; overflow: hidden; }
        .sidebar {
            width: 260px;
            border-right: 1px solid #e5e7eb;
            overflow-y: auto;
            padding: 12px;
            background: #fafafa;
        }
        .user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 4px;
        }
        .user-item:hover { background: #f0f0f0; }
        .user-item.active { background: #e0e7ff; }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #4A90D9;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }
        .user-name { font-weight: 500; flex: 1; }
        .status { font-size: 12px; color: #888; }
        .online { color: #22c55e; }
        .offline { color: #9ca3af; }
        .chat { flex: 1; display: flex; flex-direction: column; }
        .chat-header {
            padding: 12px 20px;
            border-bottom: 1px solid #e5e7eb;
            font-weight: 600;
            background: #f8fafc;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #ffffff;
        }
        .message {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
        }
        .message.sent {
            align-self: flex-end;
            background: #4A90D9;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.received {
            align-self: flex-start;
            background: #f1f3f5;
            color: #1a1a2e;
            border-bottom-left-radius: 4px;
        }
        .message .time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
        }
        .message .media { max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 4px; }
        .input-area {
            padding: 12px 16px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 8px;
            background: #f8fafc;
        }
        .input-area input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid #ddd;
            border-radius: 30px;
            outline: none;
            font-size: 15px;
        }
        .input-area button {
            padding: 10px 20px;
            background: #4A90D9;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 15px;
        }
        .file-btn {
            background: #e5e7eb;
            border: none;
            border-radius: 30px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 18px;
        }
        .empty-state {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            font-size: 16px;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 999;
        }
        @media (max-width: 640px) {
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #e5e7eb; max-height: 200px; }
            .main { flex-direction: column; }
        }
    </style>
</head>
<body>

<!-- ===== АВТОРИЗАЦИЯ ===== -->
<div id="authScreen" class="auth-box">
    <h2>💙 Miligram</h2>
    <div id="loginForm">
        <input type="text" id="loginUsername" placeholder="Имя пользователя">
        <input type="password" id="loginPassword" placeholder="Пароль" onkeypress="if(event.key==='Enter') login()">
        <button onclick="login()">Войти</button>
        <div class="auth-link" onclick="showRegister()">📝 Создать аккаунт</div>
        <div id="authError" class="error"></div>
    </div>
    <div id="registerForm" class="hidden">
        <input type="text" id="regUsername" placeholder="Имя пользователя">
        <input type="password" id="regPassword" placeholder="Пароль">
        <input type="password" id="regPasswordConfirm" placeholder="Подтвердите пароль" onkeypress="if(event.key==='Enter') register()">
        <button onclick="register()">Создать</button>
        <div class="auth-link" onclick="showLogin()">← Назад</div>
        <div id="regError" class="error"></div>
    </div>
</div>

<!-- ===== ОСНОВНОЕ ПРИЛОЖЕНИЕ ===== -->
<div id="app" class="app hidden">
    <div class="header">
        <h3>💬 Miligram</h3>
        <button class="logout-btn" onclick="logout()">🚪 Выйти</button>
    </div>
    <div class="main">
        <div class="sidebar" id="sidebar">
            <div id="userList"></div>
        </div>
        <div class="chat" id="chatArea">
            <div class="chat-header" id="chatHeader">Выберите пользователя</div>
            <div class="messages" id="messagesContainer">
                <div class="empty-state">👤 Выберите собеседника</div>
            </div>
            <div class="input-area" id="inputArea" style="display:none;">
                <input type="text" id="messageInput" placeholder="Сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
                <label class="file-btn" for="fileInput">📎</label>
                <input type="file" id="fileInput" style="display:none" onchange="uploadFile(this.files[0])">
                <button onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>
</div>

<script>
// ============================================
// КОНФИГУРАЦИЯ
// ============================================
const SERVER_URL = window.location.origin;
let token = localStorage.getItem('token') || null;
let currentUser = null;
let currentChatUser = null;
let users = [];
let messages = [];
let pollInterval = null;

// ============================================
// ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
// ============================================
function toast(text) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = text;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2000);
}

function getAuthHeaders() {
    return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
}

function showAuthError(id, text) {
    document.getElementById(id).textContent = text;
}

// ============================================
// АВТОРИЗАЦИЯ
// ============================================
function showRegister() {
    document.getElementById('loginForm').classList.add('hidden');
    document.getElementById('registerForm').classList.remove('hidden');
    document.getElementById('authError').textContent = '';
    document.getElementById('regError').textContent = '';
}
function showLogin() {
    document.getElementById('registerForm').classList.add('hidden');
    document.getElementById('loginForm').classList.remove('hidden');
    document.getElementById('authError').textContent = '';
    document.getElementById('regError').textContent = '';
}

async function register() {
    const username = document.getElementById('regUsername').value.trim();
    const password = document.getElementById('regPassword').value.trim();
    const confirm = document.getElementById('regPasswordConfirm').value.trim();
    if (!username || !password || !confirm) {
        showAuthError('regError', 'Заполните все поля');
        return;
    }
    if (password !== confirm) {
        showAuthError('regError', 'Пароли не совпадают');
        return;
    }
    try {
        const res = await fetch(SERVER_URL + '/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
            toast('✅ Аккаунт создан! Войдите.');
            showLogin();
            document.getElementById('regUsername').value = '';
            document.getElementById('regPassword').value = '';
            document.getElementById('regPasswordConfirm').value = '';
        } else {
            showAuthError('regError', data.error || 'Ошибка');
        }
    } catch(e) {
        showAuthError('regError', 'Ошибка соединения');
    }
}

async function login() {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value.trim();
    if (!username || !password) {
        showAuthError('authError', 'Заполните поля');
        return;
    }
    try {
        const res = await fetch(SERVER_URL + '/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
            token = data.token;
            currentUser = data.username;
            localStorage.setItem('token', token);
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('app').classList.remove('hidden');
            initApp();
        } else {
            showAuthError('authError', data.error || 'Неверные данные');
        }
    } catch(e) {
        showAuthError('authError', 'Ошибка соединения');
    }
}

function logout() {
    localStorage.removeItem('token');
    token = null;
    currentUser = null;
    currentChatUser = null;
    if (pollInterval) clearInterval(pollInterval);
    document.getElementById('app').classList.add('hidden');
    document.getElementById('authScreen').style.display = 'block';
    document.getElementById('loginForm').classList.remove('hidden');
    document.getElementById('registerForm').classList.add('hidden');
    document.getElementById('authError').textContent = '';
}

// ============================================
// ОСНОВНОЕ ПРИЛОЖЕНИЕ
// ============================================
async function initApp() {
    await loadUsers();
    renderUsers();
    startPolling();
}

async function loadUsers() {
    try {
        const res = await fetch(SERVER_URL + '/users', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        users = await res.json();
        users = users.filter(u => u.username !== currentUser);
    } catch(e) {
        users = [];
    }
}

function renderUsers() {
    const container = document.getElementById('userList');
    if (users.length === 0) {
        container.innerHTML = '<div style="padding:12px;color:#9ca3af;text-align:center;">Нет пользователей</div>';
        return;
    }
    container.innerHTML = users.map(u => `
        <div class="user-item ${currentChatUser === u.username ? 'active' : ''}" onclick="selectUser('${u.username}')">
            <div class="user-avatar" style="background: #4A90D9;">${u.username.charAt(0).toUpperCase()}</div>
            <div>
                <div class="user-name">${u.username}</div>
                <div class="status ${u.status === 'online' ? 'online' : 'offline'}">${u.status || 'offline'}</div>
            </div>
        </div>
    `).join('');
}

function selectUser(username) {
    currentChatUser = username;
    renderUsers();
    document.getElementById('chatHeader').textContent = username;
    document.getElementById('inputArea').style.display = 'flex';
    loadMessages();
}

async function loadMessages() {
    if (!currentChatUser) return;
    try {
        const res = await fetch(SERVER_URL + '/messages/' + currentChatUser, {
            headers: getAuthHeaders()
        });
        messages = await res.json();
        renderMessages();
    } catch(e) {}
}

function renderMessages() {
    const container = document.getElementById('messagesContainer');
    if (messages.length === 0) {
        container.innerHTML = '<div class="empty-state">💬 Нет сообщений</div>';
        return;
    }
    container.innerHTML = messages.map(m => `
        <div class="message ${m.from_user === currentUser ? 'sent' : 'received'}">
            ${m.text || ''}
            ${m.media_url ? `<img src="${m.media_url}" class="media" />` : ''}
            <div class="time">${new Date(m.created_at).toLocaleTimeString()}</div>
        </div>
    `).join('');
    container.scrollTop = container.scrollHeight;
}

async function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text || !currentChatUser) return;
    input.value = '';

    try {
        await fetch(SERVER_URL + '/send', {
            method: 'POST',
            headers: getAuthHeaders(),
            body: JSON.stringify({
                chat_id: 1,
                from_user: currentUser,
                to_user: currentChatUser,
                text: text,
                media_url: null
            })
        });
        await loadMessages();
    } catch(e) {
        toast('❌ Ошибка отправки');
    }
}

async function uploadFile(file) {
    if (!file || !currentChatUser) return;
    const formData = new FormData();
    formData.append('file', file);
    try {
        const res = await fetch(SERVER_URL + '/upload', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token },
            body: formData
        });
        const data = await res.json();
        if (data.success) {
            await fetch(SERVER_URL + '/send', {
                method: 'POST',
                headers: getAuthHeaders(),
                body: JSON.stringify({
                    chat_id: 1,
                    from_user: currentUser,
                    to_user: currentChatUser,
                    text: '📎 Медиа',
                    media_url: data.url
                })
            });
            await loadMessages();
        }
    } catch(e) {
        toast('❌ Ошибка загрузки');
    }
}

// ============================================
// ПОЛЛИНГ
// ============================================
function startPolling() {
    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(async () => {
        if (currentChatUser) {
            await loadMessages();
        }
        await loadUsers();
        renderUsers();
    }, 3000);
}

// ============================================
// АВТОЗАПУСК
// ============================================
if (token) {
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('app').classList.remove('hidden');
    initApp();
}
</script>
</body>
</html>
